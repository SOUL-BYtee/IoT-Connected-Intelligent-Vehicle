<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#111c33"/></linearGradient>
  </defs>
  <rect width="1200" height="680" rx="18" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc">IoT-Connected Intelligent Vehicle</text>
  <text x="600" y="76" text-anchor="middle" font-size="14" fill="#94a3b8">End-to-end system architecture: from the vehicle to the cloud and the data platform</text>

  <!-- zones -->
  <rect x="30" y="100" width="640" height="440" rx="14" fill="#16233f" stroke="#2f4672" stroke-width="1.5"/>
  <text x="52" y="128" font-size="13" font-weight="700" fill="#7dd3fc" letter-spacing="2">VEHICLE (EDGE)</text>
  <rect x="700" y="100" width="470" height="440" rx="14" fill="#16233f" stroke="#2f4672" stroke-width="1.5"/>
  <text x="722" y="128" font-size="13" font-weight="700" fill="#7dd3fc" letter-spacing="2">CLOUD AND DATA PLATFORM</text>

  <!-- hardware -->
  <rect x="55" y="150" width="190" height="170" rx="10" fill="#7c2d12" stroke="#fb923c" stroke-width="1.5"/>
  <text x="150" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#fed7aa" letter-spacing="1.5">HARDWARE</text>
  <text x="150" y="208" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Chassis and motors</text>
  <text x="150" y="236" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Lidar</text>
  <text x="150" y="264" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Wheel encoders, IMU</text>
  <text x="150" y="292" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Power and wiring</text>

  <!-- embedded -->
  <rect x="275" y="150" width="170" height="170" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="360" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#bbf7d0" letter-spacing="1.5">EMBEDDED SYSTEMS</text>
  <text x="360" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">STM32</text>
  <text x="360" y="240" text-anchor="middle" font-size="14" fill="#dcfce7">Motor control</text>
  <text x="360" y="262" text-anchor="middle" font-size="14" fill="#dcfce7">Sensor reading</text>
  <text x="360" y="284" text-anchor="middle" font-size="14" fill="#dcfce7">Safety stop</text>

  <!-- ros -->
  <rect x="475" y="150" width="170" height="170" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="560" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#bfdbfe" letter-spacing="1.5">ROS 2</text>
  <text x="560" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Orange Pi</text>
  <text x="560" y="240" text-anchor="middle" font-size="14" fill="#dbeafe">Nav2 navigation</text>
  <text x="560" y="262" text-anchor="middle" font-size="14" fill="#dbeafe">Localization, planning</text>
  <text x="560" y="284" text-anchor="middle" font-size="14" fill="#dbeafe">STM32 + MQTT bridge</text>

  <line x1="245" y1="235" x2="275" y2="235" stroke="#475569" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="445" y1="235" x2="475" y2="235" stroke="#475569" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="360" y="342" text-anchor="middle" font-size="12" fill="#94a3b8">UART / serial</text>

  <!-- simulation -->
  <rect x="55" y="375" width="590" height="140" rx="10" fill="#1b2a4a" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="75" y="400" font-size="12" font-weight="700" fill="#cbd5e1" letter-spacing="1.5">DEVELOPMENT AND SIMULATION</text>
  <text x="75" y="436" font-size="16" font-weight="600" fill="#fff">Gazebo Sim  |  RViz  |  URDF / xacro robot model</text>
  <text x="75" y="464" font-size="14" fill="#94a3b8">The same navigation stack is tested in simulation before it runs on the vehicle.</text>
  <text x="75" y="490" font-size="14" fill="#94a3b8">Simulation and visualization are complete. Nav2 tuning is in progress.</text>
  <line x1="560" y1="375" x2="560" y2="320" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- cloud -->
  <rect x="725" y="150" width="200" height="105" rx="10" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="825" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#ddd6fe" letter-spacing="1.5">CLOUD</text>
  <text x="825" y="208" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">EMQX MQTT broker</text>
  <text x="825" y="234" text-anchor="middle" font-size="13" fill="#ede9fe">Topics, access control</text>

  <rect x="955" y="150" width="190" height="105" rx="10" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1050" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#ddd6fe" letter-spacing="1.5">CLOUD</text>
  <text x="1050" y="208" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Remote control</text>
  <text x="1050" y="234" text-anchor="middle" font-size="13" fill="#ede9fe">Monitor, send goals</text>
  <line x1="925" y1="202" x2="955" y2="202" stroke="#475569" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- data -->
  <rect x="725" y="300" width="420" height="215" rx="10" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="935" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#99f6e4" letter-spacing="1.5">DATA ENGINEERING</text>
  <rect x="745" y="350" width="115" height="80" rx="8" fill="#0f3d3a" stroke="#5eead4"/>
  <text x="802" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Kafka</text>
  <text x="802" y="408" text-anchor="middle" font-size="12" fill="#ccfbf1">Ingestion</text>
  <rect x="885" y="350" width="115" height="80" rx="8" fill="#0f3d3a" stroke="#5eead4"/>
  <text x="942" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Spark</text>
  <text x="942" y="408" text-anchor="middle" font-size="12" fill="#ccfbf1">Processing</text>
  <rect x="1025" y="350" width="100" height="80" rx="8" fill="#0f3d3a" stroke="#5eead4"/>
  <text x="1075" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">BigQuery</text>
  <text x="1075" y="408" text-anchor="middle" font-size="12" fill="#ccfbf1">Storage</text>
  <line x1="860" y1="390" x2="885" y2="390" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1000" y1="390" x2="1025" y2="390" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="935" y="470" text-anchor="middle" font-size="14" fill="#ccfbf1">Telemetry becomes analysis and dashboards</text>
  <text x="935" y="494" text-anchor="middle" font-size="12" fill="#5eead4">Pipeline planned</text>

  <!-- links -->
  <path d="M645 200 L725 200" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="685" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">MQTT</text>
  <path d="M825 255 L825 300" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="840" y="283" font-size="12" fill="#94a3b8">telemetry</text>

  <!-- legend -->
  <g font-size="13" fill="#cbd5e1">
    <rect x="30" y="580" width="1140" height="70" rx="12" fill="#16233f" stroke="#2f4672"/>
    <text x="52" y="606" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">TEAMS</text>
    <rect x="52" y="620" width="14" height="14" rx="3" fill="#fb923c"/><text x="74" y="632">Hardware</text>
    <rect x="170" y="620" width="14" height="14" rx="3" fill="#4ade80"/><text x="192" y="632">Embedded Systems</text>
    <rect x="340" y="620" width="14" height="14" rx="3" fill="#60a5fa"/><text x="362" y="632">ROS 2</text>
    <rect x="430" y="620" width="14" height="14" rx="3" fill="#a78bfa"/><text x="452" y="632">Cloud</text>
    <rect x="520" y="620" width="14" height="14" rx="3" fill="#2dd4bf"/><text x="542" y="632">Data Engineering</text>
    <text x="760" y="606" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">LINE STYLE</text>
    <rect x="760" y="620" width="30" height="14" rx="3" fill="none" stroke="#cbd5e1"/><text x="800" y="632">Core system</text>
    <rect x="910" y="620" width="30" height="14" rx="3" fill="none" stroke="#cbd5e1" stroke-dasharray="5 3"/><text x="950" y="632">Planned or supporting</text>
  </g>
</svg>
